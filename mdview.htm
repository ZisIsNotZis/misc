<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MD Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{max-width:900px;margin:2rem auto;padding:0 1rem;font:16px/1.6 system-ui}
#mdViewer{padding:2rem;border:1px solid #eee;border-radius:6px;min-height:70vh}
#mdViewer h1,h2,h3{margin:1.2em 0 0.6em}
#mdViewer p{margin:0.8em 0}
#mdViewer pre{padding:1rem;overflow-x:auto;border-radius:4px;background:#f6f8fa}
#mdViewer blockquote{border-left:4px #ccc solid;padding-left:1rem;color:#444;margin:1em 0}
#mdViewer table{border-collapse:collapse;width:100%}
#mdViewer td,th{border:1px #ddd solid;padding:6px 10px}
</style>
</head>
<body>
<input type="file" id="fileInput" accept=".md">
<div id="mdViewer"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script>
marked.setOptions({
  highlight(code, lang){
    return hljs.getLanguage(lang) ? hljs.highlight(code,{language:lang}).value : hljs.highlightAuto(code).value
  },
  gfm:true,
  breaks:true
})

const input = document.getElementById('fileInput')
const viewer = document.getElementById('mdViewer')

input.onchange = async e=>{
  const file = e.target.files[0]
  if(!file) return
  // Remove file input after selecting file
  input.remove()
  const mdText = await file.text()
  viewer.innerHTML = marked.parse(mdText)
}
</script>
</body>
</html>
